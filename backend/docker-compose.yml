version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lingualearn-db
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lingualearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingua -d lingualearn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lingualearn-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lingua:password@db:5432/lingualearn
      - SECRET_KEY=dev-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
